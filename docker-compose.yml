services:

  # VoceChat server
  vocechat:
    # Official VoceChat server image.
    # "latest" will pull/use the latest available release.
    image: privoce/vocechat-server:latest

    # Fixed container name for easier docker commands, e.g.:
    #   docker logs vocechat-server
    #   docker restart vocechat-server
    #
    # NOTE: Only one container on this Docker host can use this name.
    container_name: vocechat-server

    # Automatically restart the container after crashes or host reboots,
    # unless the container was explicitly stopped.
    restart: unless-stopped

    ports:
      # VoceChat listens on port 3000 inside the container.
      #
      # Map host port 3009 -> container port 3000.
      # VoceChat will therefore be reachable on:
      #   http://<docker-host>:3009
      - "3009:3000"

    environment:
      # Timezone used inside the container.
      - TZ=UTC

    volumes:
      # Persist ALL VoceChat application data on the host.
      #
      # Host:
      #   /home/dockerhost/docker-volumes/vocechat
      #
      # Container:
      #   /home/vocechat-server/data
      #
      # VoceChat stores its persistent application state under this
      # data directory. Keeping it outside the container means the data
      # survives container recreation, image upgrades, Docker Compose
      # down/up cycles, etc.
      #
      # IMPORTANT:
      # Removing/recreating the container does NOT remove this directory.
      #
      # Before switching an existing VoceChat installation to this bind
      # mount, copy the contents of its existing Docker volume into this
      # directory so that existing data is retained.
      - /home/dockerhost/docker-volumes/vocechat:/home/vocechat-server/data

    healthcheck:
      # Periodically request VoceChat's HTTP endpoint from inside the
      # container to verify that the server is responding.
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/"
        ]

      # Run the health check every 30 seconds.
      interval: 30s

      # Consider an individual health check failed after 10 seconds.
      timeout: 10s

      # Mark the container unhealthy after 3 consecutive failures.
      retries: 3

      # Give VoceChat 15 seconds to initialize before health-check
      # failures start counting.
      start_period: 15s

  # Outline knowledge base
  outline:
    image: docker.getoutline.com/outlinewiki/outline:latest
    container_name: outline
    restart: unless-stopped

    ports:
      # VoceChat: http://host:3009
      # Outline:   http://host:3010
      - "3010:3000"

    environment:
      NODE_ENV: production

      # Public URL users/agents use to reach Outline.
      URL: ${OUTLINE_URL}

      # Outline itself listens on 3000 inside the container.
      PORT: 3000

      SECRET_KEY: ${OUTLINE_SECRET_KEY}
      UTILS_SECRET: ${OUTLINE_UTILS_SECRET}

      DATABASE_URL: postgres://outline:${OUTLINE_POSTGRES_PASSWORD}@outline-postgres:5432/outline
      PGSSLMODE: disable

      REDIS_URL: redis://outline-redis:6379

      FILE_STORAGE: local
      FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data

      # We're currently serving Outline directly over HTTP.
      FORCE_HTTPS: "false"

    volumes:
      - /home/dockerhost/docker-volumes/outline/data:/var/lib/outline/data

    depends_on:
      outline-postgres:
        condition: service_healthy
      outline-redis:
        condition: service_healthy

  outline-postgres:
    image: postgres:18
    container_name: outline-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: outline
      POSTGRES_PASSWORD: ${OUTLINE_POSTGRES_PASSWORD}
      POSTGRES_DB: outline

    volumes:
      - /home/dockerhost/docker-volumes/outline/postgres:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outline -d outline"]
      interval: 10s
      timeout: 5s
      retries: 5

  outline-redis:
    image: redis:8
    container_name: outline-redis
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - /home/dockerhost/docker-volumes/outline/redis:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
